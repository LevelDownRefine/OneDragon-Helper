name: Build EXE & Run Exe Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    env:
      # 强制 UTF-8 模式：Runner exe 在英文 locale(cp1252) 下经 colorama 输出中文会崩，
      # 此变量让冻结解释器以 UTF-8 写 stdout（与 deploy/runtime_hook_utf8.py 同源修复）。
      PYTHONUTF8: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      # build.bat 会：① PyInstaller 打包 GUI(onedir) + Runner(onefile)
      # ② 拷贝受控资源和版本信息 ③ 在临时副本跑 tests/exe/test_*_exe.py
      # （真实启动打包产物做集成测试，需 Windows 管理员态，GitHub Windows runner 默认满足）。
      # CI 环境变量使 build.bat 跳过交互式 pause；exe 测试失败则 build.bat 以非 0 退出，
      # call 把退出码透传给本步骤，使构建失败。
      - name: Build EXE and run exe integration tests
        shell: cmd
        run: call deploy\build.bat

      # 测试失败时仍可上传干净的程序包排查；未通过文件清单检查的目录不上传。
      - name: Check package before upload
        id: package-check
        if: always() && hashFiles('deploy/dist/OneDragon-Helper/version.json') != ''
        run: uv run python tools/release_package.py check --package deploy/dist/OneDragon-Helper

      - name: Upload packaged EXE
        if: always() && steps.package-check.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: OneDragon-Helper-windows
          path: deploy/dist/OneDragon-Helper
          if-no-files-found: warn
          retention-days: 7
