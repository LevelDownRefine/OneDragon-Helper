name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # 源码全量测试只在 ubuntu 跑；Windows 侧仅跑打包产物集成测试（tests/exe/），
    # 由 build-exe.yml 打包后覆盖，避免非打包测试在 Windows 重复跑一遍。
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (OpenGL/EGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Compile Python files
        run: |
          uv run python -m compileall -q -x '\.venv' .

      - name: Lint with ruff
        run: |
          uv run ruff check src tests tools

      - name: Format check with ruff
        run: |
          uv run ruff format --check src tests tools

      - name: Run tests
        env:
          PYTHONPATH: src
        run: uv run python -m unittest discover -s tests -p 'test*.py'
