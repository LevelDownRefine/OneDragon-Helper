name: Nightly Build & Release

# 每天北京时间 09:30（UTC 01:30）触发；手动 workflow_dispatch 便于调试。
# 仅当 main 相较上次 nightly release 有新提交时才构建并发布，避免无意义的重复 nightly。
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 覆盖 nightly release 与 tag 需要写权限

jobs:
  nightly:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1   # 与 build-exe.yml 同源：冻结 exe 在英文 locale 下经 colorama 输出中文不崩

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 判断 main 是否有新提交：拿 main 最新 commit SHA，与上次 nightly release 指向的
      # commit 比较。相等 ⇒ 无更新，跳过；否则构建发布。首次（无 nightly tag）必然发。
      - name: Check for new commits since last nightly
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          latest=$(gh api "repos/$repo/commits/main" --jq '.sha')
          nightly_sha=$(gh release view nightly --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)
          echo "latest=$latest"
          echo "nightly_sha=${nightly_sha:-<none>}"
          if [ -n "$nightly_sha" ] && [ "$latest" = "$nightly_sha" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "无相较上次 nightly 的新提交，跳过"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "检测到新提交，继续 nightly 构建"
          fi

      - name: Stop if no new commits
        if: steps.check.outputs.has_update != 'true'
        run: echo "今天无新提交，跳过 nightly" && exit 0

      - name: Set up uv
        if: steps.check.outputs.has_update == 'true'
        uses: astral-sh/setup-uv@v5

      # 注入北京日期戳版本：仅改 CI 临时环境的 pyproject（不影响仓库），使 nightly 产物/发布可辨识。
      # 注：冻结 exe 运行时读不到 pyproject（design-in，--version 仍 unknown），日期戳主要体现在发布标题。
      # 用 git bash 自带 sed，避免依赖 windows runner 上的 python 是否在 PATH。
      - name: Inject nightly date-stamp version
        if: steps.check.outputs.has_update == 'true'
        shell: bash
        run: |
          date_bj=$(TZ='Asia/Shanghai' date +%Y%m%d)
          echo "nightly date stamp: $date_bj"
          sed -i -E "s/^version = .*/version = \"0.1.0+$date_bj\"/" pyproject.toml
          echo "injected version -> $(grep -n '^version' pyproject.toml)"

      # 复用 build-exe.yml 的构建链路：打包 GUI(onedir)+Runner(onefile) 并跑 exe 集成测试。
      # exe 测试失败则 build.bat 非 0 退出，本步骤失败 ⇒ 不发布。
      - name: Build EXE and run exe integration tests
        if: steps.check.outputs.has_update == 'true'
        shell: cmd
        run: call deploy\build.bat

      - name: Package dist into zip
        if: steps.check.outputs.has_update == 'true'
        shell: pwsh
        run: Compress-Archive -Path deploy/dist/OneDragon-Helper -DestinationPath OneDragon-Helper-nightly.zip

      # 覆盖更新：先删旧 nightly release 与 tag，再基于当前 main HEAD 重建。
      - name: Delete previous nightly release & tag
        if: steps.check.outputs.has_update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" || true

      - name: Create nightly release
        if: steps.check.outputs.has_update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date_bj=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $date_bj (0.1.0+${date_bj//-/})" \
            --notes "Nightly 自动构建（北京时间 $date_bj 09:30）。对应 commit: $GITHUB_SHA" \
            OneDragon-Helper-nightly.zip
