name: Release Build

# 推送 v* tag 时自动打包并发布正式 release；手动 workflow_dispatch 仅做构建+exe 集成测试（调试用，不发布）。
# 版本号即 tag 名（如 v0.0.1），发新版时打新 tag 即「每次递增」。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 创建 release 与 tag 需要写权限

jobs:
  release:
    runs-on: windows-latest
    env:
      ODH_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      PYTHONUTF8: 1   # 与 build-exe.yml 同源：冻结 exe 在英文 locale 下经 colorama 输出中文不崩
      # 可复现构建：PyInstaller 默认把构建时刻与哈希随机序写进产物，导致源码未变的
      # exe（Runner/Updater）每次发布字节都不同，客户端只能整包重下。固定这两项后，
      # 同一份源码的产物字节一致，增量更新才能跳过未变的 exe。取值只需恒定。
      SOURCE_DATE_EPOCH: "1700000000"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      # 复用 build-exe.yml 的构建链路：打包 GUI(onedir)+Runner(onefile) 并跑 exe 集成测试。
      # exe 测试失败则 build.bat 非 0 退出，本步骤失败 ⇒ 不发布。
      - name: Build EXE and run exe integration tests
        shell: cmd
        run: call deploy\build.bat

      - name: Package dist into zip
        shell: pwsh
        run: uv run python tools/release_package.py archive --package deploy/dist/OneDragon-Helper --output OneDragon-Helper.zip

      # 仅 tag 触发时发布正式 release（手动 dispatch 跳过，避免用分支名造出错误 release）。
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"   # 形如 v0.1.7
          git fetch --tags --quiet || true   # 确保本地 tag 列表完整
          # 上一正式 tag：按版本降序取首个严格低于当前版本的 vX.Y.Z，用于生成本次更新 commit 列表
          prev=$(git tag --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r t; do
                if [ "$t" != "$version" ] \
                  && [ "$(printf '%s\n' "$t" "$version" | sort -V | head -1)" = "$t" ]; then
                  echo "$t"
                  break
                fi
              done) || true
          if [ -n "$prev" ]; then
            commits=$(git log "${prev}..${version}" --format='* %h %s')
            count=$(printf '%s\n' "$commits" | grep -c .) || true
            changelog=$(printf '\n\n## 更新内容（%s → %s，共 %s 个提交）\n\n%s' "$prev" "$version" "$count" "$commits")
          else
            changelog=$'\n\n## 首次发布'
          fi
          notes=$(printf '%s\n\n下载 OneDragon-Helper.zip 解压后即可使用。%s' "自动构建发布 $version（对应 commit: $GITHUB_SHA）" "$changelog")
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "$notes" \
            OneDragon-Helper.zip OneDragon-Helper.zip.sha256
