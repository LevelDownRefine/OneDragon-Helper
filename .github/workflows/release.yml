name: Release Build

# 推送 v* tag 时发布正式 release。优先复用 Build EXE & Run Exe Tests 在同一 commit 上
# 构建好的产物（见 build-exe.yml），只重盖版本戳后归档发布，省去重复的 PyInstaller/cargo
# 构建；找不到可用产物（未跑/失败/超过 7 天保留期）时回退全量构建。
# 手动 workflow_dispatch 仅构建+exe 测试（调试用，不发布）。
# 版本号即 tag 名（如 v0.0.1），发新版时打新 tag 即「每次递增」。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 创建 release 与 tag 需要写权限
  actions: read     # 跨 workflow 下载构建产物需要读权限

jobs:
  release:
    runs-on: windows-latest
    env:
      ODH_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # 与 build-exe.yml 同源：冻结 exe 在英文 locale 下经 colorama 输出中文不崩。
      PYTHONUTF8: 1
      # 可复现构建常量，必须与 build-exe.yml 完全一致，否则复用其产物会与本地重建字节不同。
      SOURCE_DATE_EPOCH: "1700000000"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      # 定位同一 commit 上成功的 Build EXE & Run Exe Tests run，作为产物来源。
      - name: Locate matching Build EXE run
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh 查询失败（网络/API 抖动）不应让发布失败：落空后由 fallback 全量构建。
          run_id=$(gh run list --workflow=build-exe.yml --event push --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""') || run_id=""
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      # 拉取该 run 的 Qt 发布目录与 Rust 发布目录。产物缺失/已过期（保留 7 天）则本步失败，
      # 交由后续 fallback 步骤承接。
      - name: Fetch reused build artifacts
        id: fetch
        if: steps.reuse.outputs.run-id != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy/dist deploy/dist/rust
          gh run download "${{ steps.reuse.outputs.run-id }}" \
            --name OneDragon-Helper-windows --dir deploy/dist/OneDragon-Helper
          gh run download "${{ steps.reuse.outputs.run-id }}" \
            --name OneDragon-Helper-Rust-windows --dir deploy/dist/rust/OneDragon-Helper
          # 校验产物形态：缺 version.json 说明产物缺失/过期或形态不符（如仍是旧的 ZIP 形态），
          # 本步失败后由 fallback 全量构建。
          for pkg in deploy/dist/OneDragon-Helper deploy/dist/rust/OneDragon-Helper; do
            test -f "$pkg/version.json" || { echo "复用产物不可用：缺少 $pkg/version.json"; exit 1; }
          done

      # 复用路径：产物是同一 commit 的确定性字节，只需把 dev 版本戳改成发布 tag。
      # 不传 --tag：release_package.py 默认读环境变量 ODH_RELEASE_TAG（job env 已注入）。
      # 用 bash 而非 pwsh：pwsh 步骤只取最后一条命令的退出码，两条 prepare 里第一条失败会被掩盖。
      - name: Re-stamp reused packages
        if: steps.fetch.outcome == 'success'
        shell: bash
        run: |
          uv run python tools/release_package.py prepare --package deploy/dist/OneDragon-Helper
          uv run python tools/release_package.py prepare --package deploy/dist/rust/OneDragon-Helper --frontend rust

      # 回退路径：按原方式全量构建并跑 exe 集成测试。build.bat 会先清空 deploy/dist，
      # 顺带清掉可能残留的下载产物。
      - name: Build EXE and run exe integration tests (fallback)
        if: steps.fetch.outcome != 'success'
        shell: cmd
        run: call deploy\build.bat

      - name: Build and test Rust release package (fallback)
        if: steps.fetch.outcome != 'success'
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          uv run --frozen python tools/build_rust.py --test

      # 同样用 bash：两条 archive 都要生效，pwsh 只会透传最后一条的退出码。
      - name: Package dist into zip
        shell: bash
        run: |
          uv run python tools/release_package.py archive --package deploy/dist/OneDragon-Helper --output OneDragon-Helper.zip
          uv run python tools/release_package.py archive --package deploy/dist/rust/OneDragon-Helper --output deploy/dist/rust/OneDragon-Helper-Rust.zip

      # 仅 tag 触发时发布正式 release（手动 dispatch 跳过，避免用分支名造出错误 release）。
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"   # 形如 v0.1.7
          git fetch --tags --quiet || true   # 确保本地 tag 列表完整
          # 上一正式 tag：按版本降序取首个严格低于当前版本的 vX.Y.Z，用于生成本次更新 commit 列表
          prev=$(git tag --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r t; do
                if [ "$t" != "$version" ] \
                  && [ "$(printf '%s\n' "$t" "$version" | sort -V | head -1)" = "$t" ]; then
                  echo "$t"
                  break
                fi
              done) || true
          if [ -n "$prev" ]; then
            commits=$(git log "${prev}..${version}" --format='* %h %s')
            count=$(printf '%s\n' "$commits" | grep -c .) || true
            changelog=$(printf '\n\n## 更新内容（%s → %s，共 %s 个提交）\n\n%s' "$prev" "$version" "$count" "$commits")
          else
            changelog=$'\n\n## 首次发布'
          fi
          notes=$(printf '%s\n\n推荐使用 **OneDragon-Helper-Rust.zip**，备用包为 **OneDragon-Helper.zip**，下载后解压即可使用。%s' "自动构建发布 $version（对应 commit: $GITHUB_SHA）" "$changelog")
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "$notes" \
            OneDragon-Helper.zip OneDragon-Helper.zip.sha256 \
            deploy/dist/rust/OneDragon-Helper-Rust.zip \
            deploy/dist/rust/OneDragon-Helper-Rust.zip.sha256
