name: Sync ok-ef dungeons

on:
  schedule:
    - cron: "0 3 * * 6" # 每周六 03:00 UTC（北京 11:00）
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Check and apply new stages
        id: sync
        run: |
          # exit=0 无差异；exit=1 有差异（自动 apply 后开 PR）；
          # exit=2 抓取/解析失败（跳过本次，不误开 PR）
          python tools/sync_okef_dungeons.py >/dev/null 2>&1
          code=$?
          if [ $code -eq 1 ]; then
            python tools/sync_okef_dungeons.py --apply
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync ok-ef dungeons from world_map.json"
          title: "chore: 同步终末地关卡列表"
          body: |
            检测到终末地关卡列表有更新，已自动从 ok-end-field 的 `world_map.json` 同步到 `config/dungeon_list.yml`。

            - display = value = 关卡名，分类 = stages_dict 的 key，全部自动生成，无需人工修改
            - 移除的关卡仅报告不删除（避免上游短暂缺失时丢配置）
            - 直接合并即可
          branch: auto-sync/okef-dungeons
          delete-branch: true
