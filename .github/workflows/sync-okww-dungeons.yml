name: Sync ok-ww dungeons

on:
  schedule:
    - cron: "15 3 * * 6" # 每周六 03:15 UTC（北京 11:15，与 okef 错开避免并发改同一 yml）
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install ruamel.yaml

      - name: Check and apply new numbers
        id: sync
        run: |
          # exit=0 无差异；exit=1 有差异（自动 apply 后开 PR）；
          # exit=2 抓取/解析失败（跳过本次，不误开 PR）
          python tools/sync_okww_dungeons.py >/dev/null 2>&1
          code=$?
          if [ $code -eq 1 ]; then
            python tools/sync_okww_dungeons.py --apply
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync ok-ww dungeon numbers from upstream"
          title: "chore: 同步鸣潮副本数字"
          body: |
            检测到鸣潮副本数量有更新，已从 ok-wuthering-waves 的 `ForgeryTask.py`/`TacetTask.py`（`self.structure`）同步到 `config/dungeon_list.yml`。

            - 新增数字的 display 为占位数字，**请人工改成友好名**（如 梦州-迅刀）
            - 移除的数字仅报告不删除（避免上游短暂回退时丢配置）
          branch: auto-sync/okww-dungeons
          delete-branch: true
