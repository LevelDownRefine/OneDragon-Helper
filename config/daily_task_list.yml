# display_name：展示名；physical_name：物理名，省略时使用展示名。
# class：机制类（daily.py 的 DAILY_CLASSES 注册表），每个日常必填。
# config：该日常读写的主文件路径（相对脚本根目录，必填）；多个日常可同份也可各自独立。
# routine：日常开关文件路径（可选，仅异环这类「开关在第二份文件」的脚本使用）。
# enable_key：主文件里的开关字段名（可选，布尔），声明即提供「不启用」。
# enable_task：开关在原生任务启用表里按该任务名定位（可选，原神一条龙）。
# options：递归选项组；key 为原生字段，values / source 二选一。
# key 含 {Day} 时展开成 Monday…Sunday 七个字段（原神地脉花，一次写满一周）。
# source.path 为资源文件，source.key 为多级键路径；原神暂保留 category 分类筛选。

