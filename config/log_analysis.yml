# 各游戏脚本运行日志的「关键词匹配」配置，由 src/log/monitor.py 读取。
#
# 原先 hardcode 在 monitor.py 各 *LogParser 子类里的判定关键词（报错标记 / 良性噪声 /
# 每日完成标记 / 终止横幅标记（崩铁专用） / 体力提取正则 / 日志文件名 / 成功与失败判定词）统一集中
# 于此，便于在不改代码的情况下调整判定口径。新增游戏时：在下面 parsers 下加一个
# 以脚本唯一标识（与 config.yml script_path 推导的 get_script_name 一致）为键的条目即可。
#
# 约定：
# - 各字段均为子串（substring）匹配，非正则（stamina_pattern 除外，它是正则）。
# - 命中任一即成立（any）。error_noise 命中则该行不计入报错。
# - success_markers / fail_markers 仅用于 parse_content 的成败判定（见各 Parser 逻辑）。
# - exit_markers 仅崩铁（March7th-Launcher）消费：作「游戏终止」横幅、截断其后的良性收尾报错；
#   其余游戏不读取它（parse_exit 已移除，无其它消费者）。
# - 缺失字段以空值兜底（如某游戏无体力提取，省略 stamina_pattern）。

parsers:
  ok-ww:
    log_pattern: 'ok-script.log'
    # 鸣潮体力：TacetTask 反复记「info_set current_stamina <N>」（分隔符空格/冒号均可），
    # 运行结束前以「current stamina: <N> not enough to continue」记真实剩余（无 info_set 前缀、
    # 用空格而非下划线）。`(?:info_set )?current[_ ]stamina` 同捕获两种格式，使末次匹配=结束剩余。
    stamina_pattern: '(?:info_set )?current[_ ]stamina[:\s]+(\d+)'
    error_markers:
      - 'ERROR'
    error_noise:
      - 'target_enemy failed'
      - 'combat check not in combat'
      - 'Failed to terminate process'
      - 'Game window is not connected'
      - 'waiting for game to start error'
      - 'capture_by_bitblt invalid params'
    daily_success_marker:
      - 'claim daily reward via  coordinate'
      - 'current daily progress 180'
    success_markers:
      - 'Successfully Executed Task'
      - 'Task completed'

  ok-nte:
    log_pattern: 'ok-script.log'
    stamina_pattern: 'info_set 当前体力 (\d+)'
    error_markers:
      - 'ERROR'
    error_noise:
      - 'target_enemy failed'
      - 'Failed to terminate process'
    daily_success_marker:
      - 'info_set failed []'
    success_markers:
      - 'Successfully Executed Task'
      - 'Task completed'

  ok-ef:
    log_pattern: '日常任务_*.txt'
    # 终末地「每日做完」=『成功任务』栏含 ⭐日常奖励（OkEfLogParser.parse_daily 限定在该栏内判定）。
    # 整体执行状态（部分失败/异常结束）不代表日常没做；且 ⭐日常奖励 也可能出现在失败任务栏，
    # 故不可直接用整体状态或全文匹配。此 marker 为栏内判定的关键词，由覆写消费。
    daily_success_marker:
      - '⭐日常奖励'
    success_markers:
      - '执行状态: 完成'

  March7th-Launcher:
    log_pattern: '*.log'
    # March7th 在「停止运行」统一总结块里同时打「开拓力: X/300」（与开局同格式）和显式
    # 「开拓力剩余X/300」（无分隔符、仅结尾出现一次）。`(?:剩余|[：:\s]+)?` 兼容带/不带
    # 「剩余」标记，使末次匹配优先命中显式剩余行；空格/全角冒号/半角冒号分隔均兼容。
    stamina_pattern: '开拓力(?:剩余|[：:\s]+)?(\d+)/(\d+)'
    error_markers:
      - 'ERROR'
    daily_success_marker:
      - '每日实训已完成'
      - '每日实训奖励完成'
    exit_markers:
      - '游戏终止'
      - '停止运行'

  OneDragon-Launcher:
    log_pattern: 'log.txt'
    stamina_pattern: '剩余电量 (\d+) 储蓄电量 (\d+) 以太电池 (\d+)'
    error_markers:
      - '[ERROR]'
    error_noise:
      - '指令[ 等待大世界画面 ] 执行失败 返回状态 未到达大世界'
    daily_success_marker:
      - '日常奖励领取成功'
    success_markers:
      - '指令[ 一条龙 ] 执行成功'
      - '指令[ 执行应用组 one_dragon ] 执行成功'

  BetterGI:
    log_pattern: 'better-genshin-impact*.log'
    stamina_pattern: '原粹树脂：(\d+)，浓缩树脂：(\d+)'
    error_markers:
      - '[ERR]'
      - '异常:'
      - '异常：'
    daily_success_marker:
      - '今日奖励已领取'
    success_markers:
      - '一条龙和配置组任务结束'
    fail_markers:
      - '未领取'
