# 脚本失败邮件通知配置模板（QQ 邮箱 SMTP，收发同号）
#
# 使用方式：复制本文件为 config/notify_mail.yml 并填入真实值。
#   - notify_mail.yml 已被 .gitignore 忽略，不会进版本库。
#   - 授权码获取：QQ 邮箱网页版 → 设置 → 账号 → 开启「SMTP 服务」→ 生成授权码（16 位，非登录密码）。
#   - 发件邮箱即收件邮箱，邮件由自己发给自己。
#
# 字段缺失或为空时，notify_mail.py 会告警并跳过发送，不影响脚本链其余环节。
email: ""          # 发件（兼收件）QQ 邮箱，如 123456789@qq.com
password: ""       # SMTP 授权码（16 位字母）
