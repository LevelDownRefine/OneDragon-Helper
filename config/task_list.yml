# type：仅顶层任务声明 daily / weekly。
# display_name：展示名；physical_name：物理名，省略时使用展示名。
# options：递归选项组。key 为选项读写字段；values / source 二选一。
# values 内每个选项可继续包含同样的 options；source 用 path / category 定位资源。
# 顶层 key 供任务操作使用；allow_disable 声明原生任务可停用。

