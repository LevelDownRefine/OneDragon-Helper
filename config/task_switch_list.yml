# 鸣潮：一条龙（DailyTask）里的布尔开关。该文件没有统一前缀，且"每日任务后运行的附加
# 任务"是列表、其余项是取值（刷什么 / 刷第几个），故靠 names 白名单挑出任务开关。
ok-ww:
  config: data/apps/ok-ww/working/configs/DailyTask.json
  task_pattern: "(.+)"
  names:
    Farm Nightmare Nest for Daily Echo: 使用梦魇巢穴获取日常声骸

