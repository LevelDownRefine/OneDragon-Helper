    - {id: claim_daily, display_name: 活跃度奖励, keys: [daily_claim, 活跃度奖励], type: bool}
    - {id: claim_period, display_name: 环期任务奖励, keys: [daily_claim, 环期任务奖励], type: bool}
    tasks:
    - 日常领取
  - display_name: 喷泉签到
    config: data/apps/ok-nte/working/configs/DailyRoutineTaskConfigs.json
    fields:
    - id: fountain_mode
      display_name: 方式
      keys: [fountain, 签到方式]
      type: choice
      values: [签到, 捞币]
    tasks:
    - 喷泉签到
  - display_name: 异象家具
    config: data/apps/ok-nte/working/configs/DailyRoutineTaskConfigs.json
    fields:
    - {id: furniture_mammon, display_name: 挑战玛门, keys: [furniture, 挑战玛门], type: bool}
    tasks:
    - 异象家具
  config: data/apps/ok-nte/working/configs/DailyPlanTask.json
  list_key: 计划任务
  id_key: id
  enabled_key: enabled
  names:
    coffee: 一咖舍
    daily_claim: 日常领取
    cinema_date: 影院约会
    fountain: 喷泉签到
    furniture: 异象家具
    gift: 羁遇赠礼

