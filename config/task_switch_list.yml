  task_pattern: "(.+_enable)"
  names:
    power_enable: 清体力
    daily_enable: 每日实训
    reward_enable: 领取奖励
    echo_of_war_enable: 历战余响
    weekly_divergent_enable: 差分宇宙
    universe_enable: 模拟宇宙
    forgottenhall_enable: 混沌回忆
    purefiction_enable: 虚构叙事
    apocalyptic_enable: 末日幻影
    fight_enable: 锄大地
    activity_enable: 活动
    activity_dailycheckin_enable: 每日签到
    reward_dispatch_enable: 委托奖励
    reward_mail_enable: 邮件奖励
    reward_assist_enable: 支援奖励
    reward_quest_enable: 每日实训奖励
    reward_srpass_enable: 无名勋礼奖励
    reward_redemption_code_enable: 兑换码奖励
    reward_achievement_enable: 成就奖励
    reward_message_enable: 短信奖励
    asset_manager_enable: 资产管理
