# 鸣潮：一条龙（DailyTask）的开关分两处 —— 布尔项，以及「每日任务后运行的附加任务」
# （多选，候选项见 src/task/DailyTask.py 的 options）。行名取自 i18n 的 zh_CN 译文。
ok-ww:
  config: data/apps/ok-ww/working/configs/DailyTask.json
  segments:
    - task_pattern: "(.+)"
      names:
        Farm Nightmare Nest for Daily Echo: 使用梦魇巢穴获取日常声骸
    - list_key: Additional Tasks to Run After Daily Task
      names:
        Check Weekly Garden: 检查每周乐园
        Auto Farm all Nightmare Nest: 自动刷所有梦魇巢穴
        Merge Echo If discarded > 1000: 已弃置声骸超过1000时融合
        Teleport and Farm 4C Echo: 传送并刷取4C声骸

