# options 为任务的子设置，tasks 关联本声明反读出的任务名；当前值只反读原生配置。
# 脚本原生任务的开关声明：把该脚本自带的任务列表接到配置弹窗的「任务」区。
# 声明本文件的脚本才显示该区，未声明（或该脚本未安装、缺表）即整区不出现。
#
# 每个脚本一个节点（脚本标识与 config.yml 的 script_name 一致），声明形式四选一：
#   ① config + tasks_key + enabled_key
#        tasks_key   任务定义所在键：{任务 id: 任务名}
#        enabled_key 任务启用表所在键：{任务 id: 开关}，键与定义表一致
#   ② config + task_pattern
#        白名单正则（须恰好一个捕获组）：同一张表里键名匹配它的顶层项即任务项，捕获组
#        即行名、值本身即开关；值不是 bool 的项（带子选项的）不作开关
#   ③ config + list_key + id_key + enabled_key
#        应用列表形态：{list_key: [{id_key: 标识, enabled_key: 开关}]}
#   ④ config + list_key + names
#        多选形态：{list_key: [已选中的标识]}，在列表里即在跑。候选项只在脚本源码里
#        （配置只存已选中的），故 names 必填、即全部候选项
#
# ①②③可选 names：{行标识: 展示名} —— 给了它就是白名单（只列出的行才出现，行名取映射值；
# 脚本新增任务要补一行才显示），不给则全部照原样。行标识即各形态给出的原始标识（应用标识 /
# 配置键名 / 捕获组）。行名与标识相同时可简写成 [标识, ...]。
#
# 同一脚本的开关散在多处时（常见于同一个文件的不同键），用 segments 列成多段（每段一种
# 形态），节点级的 config 作为各段默认、只写一次，如 ok-ef / ok-ww。
#
# config 为该脚本的原生配置文件（相对脚本安装目录）。
BetterGI:
  options:
  - display_name: 领取每日奖励
    config: User/OneDragon/默认配置.json
    fields:
    - id: daily_reward_country
      display_name: 地区
      keys: [AdventurersGuildCountry]
      type: choice
      source: {path: GameTask/Common/Element/Assets/Json, prefix: 冒险家协会_}
    tasks:
    - 领取每日奖励
  config: User/OneDragon/默认配置.json
  tasks_key: TaskDefinitions
  enabled_key: TaskEnabledList

# 终末地：⭐ 开头的布尔项是任务开关，仍留在日常总配置；另三项是多选（在列表里即在跑），
# 随日常子任务拆分迁到各自的任务卡片文件，候选项是中文故用列表简写。
ok-ef:
  options:
  - display_name: 地区建设
    config: data/apps/ok-ef/working/configs/RegionalBuildTask.json
    fields:
    - {id: regional_buy_only, display_name: 只买不卖, keys: [只买不卖], type: bool}
    - {id: regional_gift, display_name: 买礼物, keys: [是否买礼物], type: bool}
    - {id: regional_wuling, display_name: 武陵, keys: [武陵], type: bool}
    - {id: regional_valley, display_name: 四号谷地, keys: [四号谷地], type: bool}
    tasks:
    - 据点兑换
    - 买物资
    - 买卖货
  - display_name: 收信用
    config: data/apps/ok-ef/working/configs/CreditCollectTask.json
    fields:
    - {id: credit_only_nursery, display_name: 仅收培育室, keys: [尝试仅收培育室], type: bool}
    tasks:
    - 收信用
  - display_name: 送礼
    config: data/apps/ok-ef/working/configs/LiaisonGiftTask.json
    fields:
    - id: gift_target
      display_name: 优先送礼对象
      keys: [优先送礼对象]
      type: choice
      source: {path: data/apps/ok-ef/working/assets/data/characters.json, field: zh}
    tasks:
    - 送礼
  - display_name: 自动送货
    config: data/apps/ok-ef/working/configs/DailyDeliveryTask.json
    fields:
    - id: delivery_area
      display_name: 地区
      keys: [地区切换]
      type: choice
      source: {path: data/apps/ok-ef/working/assets/data/delivery_area.json, key: [delivery_area_config]}
    tasks:
    - 自动送货
  - display_name: 帝江号整理
    config: data/apps/ok-ef/working/configs/BoatOrganizeTask.json
    fields:
    - {id: boat_stash, display_name: 一键存放, keys: [⭐帝江号一键存放], type: bool}
    - {id: boat_craft, display_name: 简易制作, keys: [⭐简易制作], type: bool}
    tasks:
    - 帝江号整理
  config: data/apps/ok-ef/working/configs/DailyTask.json
  segments:
    - task_pattern: "⭐(.+)"
    - config: data/apps/ok-ef/working/configs/RegionalBuildTask.json
      list_key: "⭐地区建设"
      names: [据点兑换, 买物资, 买卖货]
    - config: data/apps/ok-ef/working/configs/BoatHarvestTask.json
      list_key: "⭐帝江号收菜"
      names: [收集线索, 使用制造舱助力]
    - config: data/apps/ok-ef/working/configs/ActivityRewardTask.json
      list_key: "⭐活动奖励"
      names: [周常奖励, 理智补给, 刮刮乐]

# 绝区零：一条龙的应用组配置（ApplicationGroupConfig 读它），展示名取自源码 APP_NAME；
# names 即白名单 —— 源码里已无定义的残留项（lost_void / withered_domain）不列入。
OneDragon-Launcher:
  options:
  - display_name: 咖啡店
    config: config/01/one_dragon/coffee.yml
    fields:
    - id: coffee_location
      display_name: 地点
      keys: [transport_point]
      type: choice
      values: [六分街 - 咖啡店, 澄辉坪 - 汀曼咖啡, 布亚斯特城区 - 片刻闲]
    tasks:
    - 咖啡店
  - display_name: 录像店营业
    config: config/01/one_dragon/random_play.yml
    fields:
    - id: video_location
      display_name: 地点
      keys: [transport_point]
      type: choice
      values: [录像店 - 柜台, 澄辉坪 - 录像店营业点, 布亚斯特城区 - 录像店营业点]
    - id: video_agent_1
      display_name: 宣传员 1
      keys: [agent_name_1]
      type: choice
      source: {path: src/zzz_od/game_data/agent.py, enum: AgentEnum, argument: 1, prepend: [随机]}
    - id: video_agent_2
      display_name: 宣传员 2
      keys: [agent_name_2]
      type: choice
      source: {path: src/zzz_od/game_data/agent.py, enum: AgentEnum, argument: 1, prepend: [随机]}
    tasks:
    - 录像店营业
  - display_name: 情报板
    config: config/01/one_dragon/intel_board.yml
    fields:
    - {id: intel_exp, display_name: 刷满经验模式, keys: [exp_grind_mode], type: bool}
    tasks:
    - 情报板
  config: config/01/one_dragon/_group.yml
  list_key: app_list
  id_key: app_id
  enabled_key: enabled
  names:
    redemption_code: 兑换码
    daily_signin: 每日签到
    coffee: 咖啡店
    random_play: 录像店营业
    charge_plan: 体力刷本
    drive_disc_dismantle: 驱动盘拆解
    email: 邮件
    engagement_reward: 活跃度奖励
    city_fund: 丽都城募
    suibian_temple: 随便观
    ridu_weekly: 丽都周纪（领奖励）
    intel_board: 情报板
    notorious_hunt: 恶名狩猎
    life_on_line: 真·拿命验收
    notify: 通知
    shiyu_defense: 式舆防卫战
    world_patrol: 锄大地

# 异环：一条龙的计划任务（DailyRoutineTask 写运行计划，展示名在源码任务类的 self.name）。
