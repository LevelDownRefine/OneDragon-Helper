# 各脚本支持的周常声明（静态配置，进 git）。
# 结构：每脚本一个列表，每项：
#   name: 周常展示名（与 dungeon_list.yml 一致用中文名）
#   dungeons_source?: 副本清单来源标记，即副本清单文件相对脚本根目录的路径
#   dungeons?: 可选副本名清单，在 dungeons_source 不存在时写。
# 周常「周几起」另存于 config/weekly_start.yml（{脚本标识: 1~7}），不在此文件。
# 用户已选副本（运行时状态）不在此文件，存于 gui_state.json 的 weekly_dungeons。
ok-ww:
  - name: 幻梦游园
OneDragon-Launcher:
  - name: 迷失之地
March7th-Assistant:
  - name: 货币战争
  - name: 历战余响
    dungeons_source: assets/config/instance_names.json
ok-ef:
  - name: 卖出物资
