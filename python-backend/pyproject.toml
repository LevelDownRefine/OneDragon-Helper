[project]
name = "onedragon-scriptchainer"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonrpcserver==5.0.9",
    "colorama==0.4.6",
    "psutil==6.1.1",
    "leveldown-updater",
    "pycaw==20220416",
    "pyinstaller==6.19.0",
    "pywin32==311; sys_platform == 'win32'",
    "requests==2.33.0",
    "pyuac==0.0.3",
    "ruff>=0.15.5",
    "ruamel-yaml>=0.18",
    "keyring>=24.0.0",
]

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
leveldown-updater = { git = "https://github.com/LevelDownRefine/updater.git", rev = "9f3c8523548fe903d2b15c5bc1d0dc4d630ba9d8" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
