[package]
name = "onedragon-rust-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "onedragon-rust-gui"
path = "src/main.rs"

[[test]]
name = "backend"
path = "tests/backend.rs"

[features]
capture = []

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "x11"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu_no_default_features"] }
winit = { version = "=0.30.13", default-features = false }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
